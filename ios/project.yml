name: Golem
options:
  bundleIdPrefix: dev.golem
  deploymentTarget:
    iOS: '27.0'
  createIntermediateGroups: true
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
packages:
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio
    # main after 0.17.7: Supertonic-3's _v2 models (edge padding), not in a release yet.
    revision: c79c4106b954f81205113c3343e5a7e59a1089b5
settings:
  base:
    SWIFT_VERSION: '6.0'
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    TARGETED_DEVICE_FAMILY: '1,2'
    PRODUCT_BUNDLE_IDENTIFIER: $(GOLEM_BUNDLE_ID)
    CODE_SIGN_STYLE: Automatic
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
targets:
  Golem:
    type: application
    platform: iOS
    sources:
      - path: Golem
    dependencies:
      - package: FluidAudio
      - target: Share
      - target: GolemActivity
    entitlements:
      path: Golem/Golem.entitlements
      properties:
        # Development-signed builds get their pushes from the APNs sandbox.
        aps-environment: development
        # Google sign-in returns to the server's https address (`webcredentials`, which
        # ASWebAuthenticationSession.Callback.https needs). Local.xcconfig sets the host.
        com.apple.developer.associated-domains: ['webcredentials:$(GOLEM_ASSOCIATED_DOMAIN)']
        # The Share extension reads the session from the Keychain (Keychain.swift).
        keychain-access-groups: ['$(AppIdentifierPrefix)$(GOLEM_BUNDLE_ID)']
    info:
      path: Golem/Info.plist
      properties:
        CFBundleDisplayName: Golem
        CFBundleShortVersionString: '0.1.0'
        CFBundleVersion: '1'
        UILaunchScreen: {}
        UIAppFonts: [InterVariable.ttf]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        ITSAppUsesNonExemptEncryption: false
        # The work for a message shows on the Lock Screen and in the Dynamic Island (GolemActivity).
        NSSupportsLiveActivities: true
        NSMicrophoneUsageDescription: Golem listens while you dictate or talk to it.
        # A conversation goes on with the screen locked.
        UIBackgroundModes: [audio]
        GolemServerURL: $(GOLEM_SERVER_URL)
        GolemAppBundleID: $(GOLEM_BUNDLE_ID)
        NSAppTransportSecurity:
          # The app talks to Golem over https only (APIClient.makeRequest); http only to localhost, in the simulator.
          NSAllowsLocalNetworking: true
    postCompileScripts:
      - name: Bundle Parakeet
        basedOnDependencyAnalysis: false
        script: |
          # Copies the dictation model (ios/scripts/fetch-parakeet.sh, ~630 MB) into the app. Without it, there is no
          # dictation.
          MODEL="${SRCROOT}/Models/parakeet-ultra"
          if [ -f "$MODEL/REVISION" ]; then
            DEST="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/Parakeet"
            mkdir -p "$DEST"
            rsync -a --delete "$MODEL/model/" "$DEST/"
          else
            echo "warning: no Parakeet in ios/Models (run ios/scripts/fetch-parakeet.sh); there will be no dictation"
          fi
      - name: Bundle Supertonic
        basedOnDependencyAnalysis: false
        script: |
          # Copies the conversation voice (ios/scripts/fetch-supertonic.sh, ~170 MB) and its license into the app.
          # Without it, there is no conversation mode.
          MODEL="${SRCROOT}/Models/supertonic-3"
          if [ -f "$MODEL/REVISION" ]; then
            DEST="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/Supertonic"
            mkdir -p "$DEST"
            rsync -a --delete "$MODEL/model/" "$DEST/"
          else
            echo "warning: no Supertonic in ios/Models (run ios/scripts/fetch-supertonic.sh); there will be no conversation mode"
          fi
      - name: Bundle shortcuts
        basedOnDependencyAnalysis: false
        script: |
          # Signs the shortcuts that Settings offers (ios/scripts/make-shortcuts.py) once per bundle id, and copies them
          # into the app. Signing needs this Mac's iCloud account; without it, Settings does not offer them.
          SIGNED="${SRCROOT}/build/shortcuts/${PRODUCT_BUNDLE_IDENTIFIER}"
          if python3 "${SRCROOT}/scripts/make-shortcuts.py" "${PRODUCT_BUNDLE_IDENTIFIER}" "${DEVELOPMENT_TEAM}" "$SIGNED"; then
            DEST="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/Shortcuts"
            mkdir -p "$DEST"
            rsync -a --delete "$SIGNED/" "$DEST/"
          else
            echo "warning: the shortcuts are not signed (shortcuts sign needs iCloud); Settings will not offer them"
          fi
    settings:
      base:
        # The model scripts write into the app bundle.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
  Share:
    type: app-extension
    platform: iOS
    sources:
      - path: Share
      # The API, the session in the Keychain, and the accent come from the app.
      - path: Golem/API/APIClient.swift
      - path: Golem/API/Models.swift
      - path: Golem/API/Keychain.swift
      - path: Golem/Views/PickedFile.swift
      - path: Golem/Design/Tokens.swift
      - path: Golem/Design/DesignSystem.swift
    entitlements:
      path: Share/Share.entitlements
      properties:
        keychain-access-groups: ['$(AppIdentifierPrefix)$(GOLEM_BUNDLE_ID)']
    info:
      path: Share/Info.plist
      properties:
        CFBundleDisplayName: Golem
        CFBundleShortVersionString: '0.1.0'
        CFBundleVersion: '1'
        GolemServerURL: $(GOLEM_SERVER_URL)
        GolemAppBundleID: $(GOLEM_BUNDLE_ID)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsImageWithMaxCount: 20
              NSExtensionActivationSupportsMovieWithMaxCount: 20
              NSExtensionActivationSupportsFileWithMaxCount: 20
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(GOLEM_BUNDLE_ID).share
  GolemActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: GolemActivity
      # The activity's attributes, the tokens, and the font come from the app.
      - path: Golem/API/ThreadActivity.swift
      - path: Golem/Design/Tokens.swift
      - path: Golem/Design/DesignSystem.swift
      - path: Golem/Resources/InterVariable.ttf
    info:
      path: GolemActivity/Info.plist
      properties:
        CFBundleDisplayName: Golem
        CFBundleShortVersionString: '0.1.0'
        CFBundleVersion: '1'
        UIAppFonts: [InterVariable.ttf]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(GOLEM_BUNDLE_ID).GolemActivity
  GolemTests:
    type: bundle.unit-test
    platform: iOS
    sources: [GolemTests]
    dependencies:
      - target: Golem
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(GOLEM_BUNDLE_ID).tests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Golem.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Golem
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  Golem:
    build:
      targets:
        Golem: all
        GolemTests: [test]
    test:
      targets: [GolemTests]
